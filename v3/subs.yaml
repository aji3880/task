---
- name: Setup subs to all
  hosts: all
  become: true
  tasks:
    - name: Remove old local.repo if present on target nodes
      ansible.builtin.file:
        path: /etc/yum.repos.d/local.repo
        state: absent

    - name: Disable automatic redhat.repo overwrite in rhsm.conf
      ansible.builtin.lineinfile:
        path: /etc/rhsm/rhsm.conf
        regexp: '^manage_repos\s*='
        line: 'manage_repos = 0'
        state: present
      ignore_errors: true

    - name: Disable subscription-manager DNF plugin warnings
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
      ignore_errors: true

    - name: Prepare temporary RHSM bundle on jump host (localhost)
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        rm -rf /tmp/rhsm-bundle && mkdir -p /tmp/rhsm-bundle/repos
        cp -r /etc/pki/consumer /tmp/rhsm-bundle/
        cp -r /etc/pki/entitlement /tmp/rhsm-bundle/
        cp -r /etc/rhsm /tmp/rhsm-bundle/
        cp /etc/yum.repos.d/*.repo /tmp/rhsm-bundle/repos/
        sed -i 's/^manage_repos\s*=.*/manage_repos = 0/' /tmp/rhsm-bundle/rhsm/rhsm.conf
        chmod -R a+rX /tmp/rhsm-bundle
      changed_when: true

    - name: Ensure clean target directories on all before copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/consumer
        - /etc/pki/entitlement
        - /etc/rhsm

    - name: Copy valid RHSM certificates and Satellite repo files to all
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: '/tmp/rhsm-bundle/consumer',    dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/entitlement', dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/rhsm',        dest: '/etc/',           mode: '0755' }
        - { src: '/tmp/rhsm-bundle/repos/',      dest: '/etc/yum.repos.d/', mode: '0644' }

    - name: Cleanup temporary RHSM bundle on jump host
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: /tmp/rhsm-bundle
        state: absent

    - name: Enable BaseOS and AppStream repositories explicitly
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled rhel-9-for-x86_64-baseos-rpms rhel-9-for-x86_64-appstream-rpms
      changed_when: true
      ignore_errors: true

    - name: Clean old DNF cache, build metadata cache, and verify repo list
      ansible.builtin.shell: |
        set -e
        dnf clean all
        dnf makecache
        dnf repolist --enabled | grep -E "baseos|appstream"
      changed_when: true