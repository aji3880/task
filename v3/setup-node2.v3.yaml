---
- name: Setup Node2 - Base Lab Environment Setup
  hosts: node2
  become: true
  tasks:

    - name: Disable rhcd service to prevent log spam
      ansible.builtin.systemd:
        name: rhcd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Create server user with encrypted password
      ansible.builtin.user:
        name: server
        password: "{{ 'R@nd0m1z3dL@bP@ss!' | password_hash('sha512') }}"
        state: present

    # =======================================================
    # PREPARATION: Clean up existing repo files on node2
    # =======================================================
    - name: Disable DNF subscription-manager plugin
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
        mode: '0644'

    - name: Find all files in /etc/yum.repos.d/
      ansible.builtin.find:
        paths: /etc/yum.repos.d/
        file_type: file
      register: repo_files

    - name: Remove all repo files in /etc/yum.repos.d/
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ repo_files.files }}"

    - name: Clean DNF cache and refresh repo metadata
      ansible.builtin.command:
        cmd: dnf clean all
      changed_when: true

    # =======================================================
    # PREREQUISITES: Setup Raw Loopback Disk Images
    # =======================================================
    - name: Check if disk_sdb.img exists
      ansible.builtin.stat:
        path: /var/opt/disk_sdb.img
      register: disk_sdb_stat

    - name: Create 10GB raw image for disk_sdb
      ansible.builtin.command:
        cmd: dd if=/dev/zero of=/var/opt/disk_sdb.img bs=1M count=10240
      when: not disk_sdb_stat.stat.exists

    - name: Check if disk_sdc.img exists
      ansible.builtin.stat:
        path: /var/opt/disk_sdc.img
      register: disk_sdc_stat

    - name: Create 10GB raw image for disk_sdc
      ansible.builtin.command:
        cmd: dd if=/dev/zero of=/var/opt/disk_sdc.img bs=1M count=10240
      when: not disk_sdc_stat.stat.exists

    # =======================================================
    # PERSISTENCE: Ensure loopback devices re-attach on boot
    # =======================================================
    - name: Create systemd service for persistent loopback devices
      ansible.builtin.copy:
        dest: /etc/systemd/system/persistent-loopback.service
        mode: '0644'
        content: |
          [Unit]
          Description=Attach Loopback Disks for Lab
          DefaultDependencies=no
          Before=local-fs-pre.target lvm2-monitor.service
          Wants=local-fs-pre.target

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/losetup /dev/loop10 /var/opt/disk_sdb.img
          ExecStart=/usr/sbin/losetup /dev/loop11 /var/opt/disk_sdc.img
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start persistent-loopback service
      ansible.builtin.systemd:
        name: persistent-loopback.service
        enabled: true
        state: started
        daemon_reload: true