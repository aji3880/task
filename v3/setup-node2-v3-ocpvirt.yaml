---
- name: Setup server 2 
  hosts: server-2
  become: true
  tasks:
    - name: Disable rhcd service to prevent log spam
      ansible.builtin.systemd:
        name: rhcd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Create server user with encrypted password
      ansible.builtin.user:
        name: server
        password: "{{ 'R@nd0m1z3dL@bP@ss!' | password_hash('sha512') }}"
        state: present

    - name: Disable DNF subscription-manager plugin
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
        mode: '0644'

    - name: Find all files in /etc/yum.repos.d/
      ansible.builtin.find:
        paths: /etc/yum.repos.d/
        file_type: file
      register: repo_files

    - name: Remove all repo files in /etc/yum.repos.d/
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ repo_files.files }}"

    - name: Clean DNF cache and refresh repo metadata
      ansible.builtin.command:
        cmd: dnf clean all
      changed_when: true

    - name: Set GRUB timeout to 15 seconds
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        2line: 'GRUB_TIMEOUT=15'
        state: present

    - name: Ensure GRUB menu is visible (not hidden)
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT_STYLE='
        line: 'GRUB_TIMEOUT_STYLE=menu'
        state: present

    - name: Regenerate GRUB configuration (BIOS & UEFI compatible on RHEL 9)
      ansible.builtin.command:
        cmd: grub2-mkconfig -o /boot/grub2/grub.cfg --update-bls-cmdline
      changed_when: true

    - name: Randomize root password so user must break in via GRUB
      ansible.builtin.user:
        name: root
        password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') | password_hash('sha512') }}"
        state: present

    - name: Change default systemd target away from multi-user (set to rescue.target)
      ansible.builtin.file:
        src: /usr/lib/systemd/system/rescue.target
        dest: /etc/systemd/system/default.target
        state: link
        force: true

    - name: Remove conflicting redhat.repo and old local.repo on server-3
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/yum.repos.d/redhat.repo
        - /etc/yum.repos.d/local.repo

    - name: Disable automatic redhat.repo generation in rhsm.conf
      ansible.builtin.lineinfile:
        path: /etc/rhsm/rhsm.conf
        regexp: '^manage_repos\s*='
        line: 'manage_repos = 0'
        state: present
      ignore_errors: true

    - name: Disable subscription-manager DNF plugin warnings
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
      ignore_errors: true

    - name: Prepare temporary RHSM bundle on jump host (localhost)
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        rm -rf /tmp/rhsm-bundle && mkdir -p /tmp/rhsm-bundle/repos
        cp -r /etc/pki/consumer /tmp/rhsm-bundle/
        cp -r /etc/pki/entitlement /tmp/rhsm-bundle/
        cp -r /etc/rhsm /tmp/rhsm-bundle/
        cp /etc/yum.repos.d/*.repo /tmp/rhsm-bundle/repos/
        rm -f /tmp/rhsm-bundle/repos/redhat.repo
        sed -i 's/^manage_repos\s*=.*/manage_repos = 0/' /tmp/rhsm-bundle/rhsm/rhsm.conf
      changed_when: true

    - name: Ensure clean target directories on server-3 before copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/consumer
        - /etc/pki/entitlement
        - /etc/rhsm

    - name: Copy valid RHSM certificates and Satellite repo files to server-3
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: '/tmp/rhsm-bundle/consumer',    dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/entitlement', dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/rhsm',        dest: '/etc/',           mode: '0755' }
        - { src: '/tmp/rhsm-bundle/repos/',      dest: '/etc/yum.repos.d/', mode: '0644' }

    - name: Cleanup temporary RHSM bundle on jump host
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: /tmp/rhsm-bundle
        state: absent

