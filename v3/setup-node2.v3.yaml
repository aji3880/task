---
- name: Setup Node2 - Base Lab Environment Setup
  hosts: node2
  become: true
  tasks:

    - name: Disable rhcd service to prevent log spam
      ansible.builtin.systemd:
        name: rhcd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Create server2 user with encrypted random password
      ansible.builtin.user:
        name: server2
        password: "{{ 'R@nd0m1z3dL@bP@ss!' | password_hash('sha512') }}"
        state: present
