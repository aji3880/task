---
- name: Full Setup and Fix Web Server on Node1
  hosts: node1
  become: true
  tasks:
    - name: Disable rhcd service to prevent log spam
      ansible.builtin.systemd:
        name: rhcd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Install httpd and firewalld packages
      ansible.builtin.dnf:
        name:
          - httpd
          - firewalld
          - policycoreutils-python-utils
        state: present

    - name: Enable and start firewalld service
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Configure httpd to listen on port 85
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 85'
        state: present

    - name: Create file1 in web root
      ansible.builtin.copy:
        dest: /var/www/html/file1
        content: "RHCSA is Awesome\n"
        mode: '0644'

    - name: Generate calendar output for file2
      ansible.builtin.shell:
        cmd: "cal > /var/www/html/file2"

    - name: Create file3 in web root
      ansible.builtin.copy:
        dest: /var/www/html/file3
        content: "This file is restored and accessible\n"
        mode: '0644'

    - name: Allow HTTPD to bind to port 85 in SELinux
      ansible.builtin.command:
        cmd: semanage port -a -t http_port_t -p tcp 85
      register: semanage_result
      failed_when:
        - semanage_result.rc != 0
        - "'already defined' not in semanage_result.stderr"
      changed_when: semanage_result.rc == 0

    - name: Restore correct SELinux context on file3
      ansible.builtin.command:
        cmd: restorecon -v /var/www/html/file3

    - name: Allow port 85/tcp through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=85/tcp
      notify: Reload Firewalld

    - name: Ensure httpd service is started and enabled
      ansible.builtin.systemd:
        name: httpd
        enabled: true
        state: restarted

  handlers:
    - name: Reload Firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload