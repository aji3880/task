---
- name: Setup RHSM Credentials, NFS, Container, and Local HTTP Repo di Server-3
  hosts: server-3
  become: true
  tasks:
    # -------------------------------------------------------------------------
    # 1. PENYELESAIAN MASALAH REPO & SERTIFIKAT SATELLITE (DARI JUMP HOST)
    # -------------------------------------------------------------------------
    - name: Remove conflicting redhat.repo and old local.repo on server-3
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/yum.repos.d/redhat.repo
        - /etc/yum.repos.d/local.repo

    - name: Disable automatic redhat.repo generation in rhsm.conf
      ansible.builtin.lineinfile:
        path: /etc/rhsm/rhsm.conf
        regexp: '^manage_repos\s*='
        line: 'manage_repos = 0'
        state: present
      ignore_errors: true

    - name: Disable subscription-manager DNF plugin warnings
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
      ignore_errors: true

    - name: Prepare temporary RHSM bundle on jump host (localhost)
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        rm -rf /tmp/rhsm-bundle && mkdir -p /tmp/rhsm-bundle/repos
        cp -r /etc/pki/consumer /tmp/rhsm-bundle/
        cp -r /etc/pki/entitlement /tmp/rhsm-bundle/
        cp -r /etc/rhsm /tmp/rhsm-bundle/
        cp /etc/yum.repos.d/*.repo /tmp/rhsm-bundle/repos/
        rm -f /tmp/rhsm-bundle/repos/redhat.repo
        sed -i 's/^manage_repos\s*=.*/manage_repos = 0/' /tmp/rhsm-bundle/rhsm/rhsm.conf
      changed_when: true

    - name: Ensure clean target directories on server-3 before copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/consumer
        - /etc/pki/entitlement
        - /etc/rhsm

    - name: Copy valid RHSM certificates and Satellite repo files to server-3
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: '/tmp/rhsm-bundle/consumer',    dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/entitlement', dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/rhsm',        dest: '/etc/',           mode: '0755' }
        - { src: '/tmp/rhsm-bundle/repos/',      dest: '/etc/yum.repos.d/', mode: '0644' }

    - name: Cleanup temporary RHSM bundle on jump host
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: /tmp/rhsm-bundle
        state: absent

    # -------------------------------------------------------------------------
    # 2. KONFIGURASI USER, PAKET DASAR & LAYANAN
    # -------------------------------------------------------------------------
    - name: Create server user with password and add to wheel group
      ansible.builtin.user:
        name: server
        password: "{{ 'password' | password_hash('sha512') }}"
        groups: wheel
        append: true
        state: present

    - name: Configure NOPASSWD sudoers privileges for server user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/server
        content: "server ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Install required packages from Satellite RHEL 9 repos
      ansible.builtin.dnf:
        name:
          - firewalld
          - nfs-utils
          - podman
          - httpd
          - createrepo_c
          - yum-utils
        disablerepo: "*"
        enablerepo:
          - rhel-9-for-x86_64-baseos-rpms
          - rhel-9-for-x86_64-appstream-rpms
        state: present

    - name: Enable and start core services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - firewalld
        - nfs-server
        - httpd

    # -------------------------------------------------------------------------
    # 3. KONFIGURASI NFS EXPORTS & USER HOME DIRECTORIES
    # -------------------------------------------------------------------------
    - name: Create NFS export top-level directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /export/it_files
        - /export/dba_files
        - /export/home

    - name: Create user home directories inside /export/home
      ansible.builtin.file:
        path: "/export/home/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - manny
        - moe
        - jack
        - marcia
        - jan
        - cindy

    - name: Copy default bash profile files to user home directories
      ansible.builtin.copy:
        src: "/etc/skel/{{ item.file }}"
        dest: "/export/home/{{ item.user }}/{{ item.file }}"
        remote_src: true
        owner: "{{ item.uid }}"
        group: "{{ item.gid }}"
        mode: '0644'
      loop: "{{ users_list }}"
      vars:
        users_list:
          - { user: 'manny',  uid: 1010, gid: 1010, file: '.bash_profile' }
          - { user: 'manny',  uid: 1010, gid: 1010, file: '.bashrc' }
          - { user: 'manny',  uid: 1010, gid: 1010, file: '.bash_logout' }
          - { user: 'moe',    uid: 1011, gid: 1011, file: '.bash_profile' }
          - { user: 'moe',    uid: 1011, gid: 1011, file: '.bashrc' }
          - { user: 'moe',    uid: 1011, gid: 1011, file: '.bash_logout' }
          - { user: 'jack',   uid: 1012, gid: 1012, file: '.bash_profile' }
          - { user: 'jack',   uid: 1012, gid: 1012, file: '.bashrc' }
          - { user: 'jack',   uid: 1012, gid: 1012, file: '.bash_logout' }
          - { user: 'marcia', uid: 1013, gid: 1013, file: '.bash_profile' }
          - { user: 'marcia', uid: 1013, gid: 1013, file: '.bashrc' }
          - { user: 'marcia', uid: 1013, gid: 1013, file: '.bash_logout' }
          - { user: 'jan',    uid: 1014, gid: 1014, file: '.bash_profile' }
          - { user: 'jan',    uid: 1014, gid: 1014, file: '.bashrc' }
          - { user: 'jan',    uid: 1014, gid: 1014, file: '.bash_logout' }
          - { user: 'cindy',  uid: 1015, gid: 1015, file: '.bash_profile' }
          - { user: 'cindy',  uid: 1015, gid: 1015, file: '.bashrc' }
          - { user: 'cindy',  uid: 1015, gid: 1015, file: '.bash_logout' }
      ignore_errors: true

    - name: Change ownership recursively on user directories
      ansible.builtin.file:
        path: "/export/home/{{ item.user }}"
        owner: "{{ item.uid }}"
        group: "{{ item.gid }}"
        recurse: true
      loop:
        - { user: 'manny',  uid: 1010, gid: 1010 }
        - { user: 'moe',    uid: 1011, gid: 1011 }
        - { user: 'jack',   uid: 1012, gid: 1012 }
        - { user: 'marcia', uid: 1013, gid: 1013 }
        - { user: 'jan',    uid: 1014, gid: 1014 }
        - { user: 'cindy',  uid: 1015, gid: 1015 }

    - name: Setup /etc/exports for client nodes
      ansible.builtin.blockinfile:
        path: /etc/exports
        create: true
        mode: '0644'
        block: |
          /export/home         *(rw,sync,no_root_squash)
          /export/it_files     *(rw,sync,no_root_squash)
          /export/dba_files    *(rw,sync,no_root_squash)
      notify: Restart NFS Service

    - name: Allow NFS and HTTP services through firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --add-service={{ item }}"
      loop:
        - nfs
        - mountd
        - rpc-bind
        - http
      notify: Reload Firewalld

    - name: Remove old repodata folders if present before reposync
      ansible.builtin.file:
        path: "/var/www/html/repo/{{ item }}/repodata"
        state: absent
      loop:
        - BaseOS
        - AppStream

    - name: Fallback firewall-cmd if ansible.posix collection is absent
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --add-service={{ item }}"
      loop:
        - nfs
        - mountd
        - rpc-bind
        - http
      notify: Reload Firewalld

    # -------------------------------------------------------------------------
    # 4. CONTAINERFILE & SINKRONISASI REPO LOKAL HTTP
    # -------------------------------------------------------------------------
    - name: Create Containerfile on server-3
      ansible.builtin.copy:
        dest: /root/Containerfile
        mode: '0644'
        content: |
          FROM registry.access.redhat.com/ubi9/ubi:latest
          RUN dnf -y install httpd; dnf clean all; systemctl enable httpd;
          RUN echo "Successful Web Server Test" | tee /var/www/html/index.html
          RUN mkdir /etc/systemd/system/httpd.service.d/; echo -e '[Service]\nRestart=always' | tee /etc/systemd/system/httpd.service.d/httpd.conf
          EXPOSE 80
          CMD [ "/sbin/init" ]

    - name: Create local HTTP repository directories
      ansible.builtin.file:
        path: "/var/www/html/repo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - BaseOS
        - AppStream

    - name: Sync RHEL 9 BaseOS packages to /var/www/html/repo/BaseOS
      ansible.builtin.command:
        cmd: >
          dnf reposync --repoid=rhel-9-for-x86_64-baseos-rpms
          -p /var/www/html/repo/BaseOS
          --download-metadata
          --norepopath
          --newest-only
      changed_when: true

    - name: Sync RHEL 9 AppStream packages to /var/www/html/repo/AppStream
      ansible.builtin.command:
        cmd: >
          dnf reposync --repoid=rhel-9-for-x86_64-appstream-rpms
          -p /var/www/html/repo/AppStream
          --download-metadata
          --norepopath
          --newest-only
      changed_when: true

    - name: Set permissions and SELinux httpd context on /var/www/html/repo
      ansible.builtin.shell: |
        chmod -R 755 /var/www/html/repo
        restorecon -Rv /var/www/html/repo
      changed_when: true

  handlers:
    - name: Restart NFS Service
      ansible.builtin.systemd:
        name: nfs-server
        state: restarted

    - name: Reload Firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload