---
- name: Full Setup and Fix Web Server on Node1
  hosts: node1
  become: true
  tasks:
    - name: Disable rhcd service to prevent log spam
      ansible.builtin.systemd:
        name: rhcd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Create server user with encrypted random password
      ansible.builtin.user:
        name: server
        password: "{{ 'password' | password_hash('sha512') }}"
        state: present

    - name: Install httpd and firewalld packages
      ansible.builtin.dnf:
        name:
          - httpd
          - firewalld
          - policycoreutils-python-utils
        state: present

    - name: Enable and start firewalld service
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Configure httpd to listen on port 85
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 85'
        state: present

    - name: Create file1 in web root
      ansible.builtin.copy:
        dest: /var/www/html/file1
        content: "RHCSA is Awesome\n"
        mode: '0644'

    - name: Generate calendar output for file2
      ansible.builtin.shell:
        cmd: "cal > /var/www/html/file2"

    - name: Create file3 in web root
      ansible.builtin.copy:
        dest: /var/www/html/file3
        content: "This file is restored and accessible\n"
        mode: '0644'

    - name: Allow HTTPD to bind to port 85 in SELinux
      ansible.builtin.command:
        cmd: semanage port -a -t http_port_t -p tcp 85
      register: semanage_result
      failed_when:
        - semanage_result.rc != 0
        - "'already defined' not in semanage_result.stderr"
      changed_when: semanage_result.rc == 0

    - name: Restore correct SELinux context on file3
      ansible.builtin.command:
        cmd: restorecon -v /var/www/html/file3

    - name: Allow port 85/tcp through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=85/tcp
      notify: Reload Firewalld

    - name: Ensure httpd service is started and enabled
      ansible.builtin.systemd:
        name: httpd
        enabled: true
        state: restarted

  handlers:
    - name: Reload Firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload

# apabila didalam ocp-virtulization
    - name: Remove conflicting redhat.repo and old local.repo on server-3
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/yum.repos.d/redhat.repo
        - /etc/yum.repos.d/local.repo

    - name: Disable automatic redhat.repo generation in rhsm.conf
      ansible.builtin.lineinfile:
        path: /etc/rhsm/rhsm.conf
        regexp: '^manage_repos\s*='
        line: 'manage_repos = 0'
        state: present
      ignore_errors: true

    - name: Disable subscription-manager DNF plugin warnings
      ansible.builtin.lineinfile:
        path: /etc/dnf/plugins/subscription-manager.conf
        regexp: '^enabled\s*='
        line: 'enabled=0'
        state: present
      ignore_errors: true

    - name: Prepare temporary RHSM bundle on jump host (localhost)
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        rm -rf /tmp/rhsm-bundle && mkdir -p /tmp/rhsm-bundle/repos
        cp -r /etc/pki/consumer /tmp/rhsm-bundle/
        cp -r /etc/pki/entitlement /tmp/rhsm-bundle/
        cp -r /etc/rhsm /tmp/rhsm-bundle/
        cp /etc/yum.repos.d/*.repo /tmp/rhsm-bundle/repos/
        rm -f /tmp/rhsm-bundle/repos/redhat.repo
        sed -i 's/^manage_repos\s*=.*/manage_repos = 0/' /tmp/rhsm-bundle/rhsm/rhsm.conf
      changed_when: true

    - name: Ensure clean target directories on server-3 before copy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pki/consumer
        - /etc/pki/entitlement
        - /etc/rhsm

    - name: Copy valid RHSM certificates and Satellite repo files to server-3
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: '/tmp/rhsm-bundle/consumer',    dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/entitlement', dest: '/etc/pki/',       mode: '0755' }
        - { src: '/tmp/rhsm-bundle/rhsm',        dest: '/etc/',           mode: '0755' }
        - { src: '/tmp/rhsm-bundle/repos/',      dest: '/etc/yum.repos.d/', mode: '0644' }

    - name: Cleanup temporary RHSM bundle on jump host
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: /tmp/rhsm-bundle
        state: absent
